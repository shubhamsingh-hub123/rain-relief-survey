<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.2);
        }

        .timezone-label {
            color: #e0e0e0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .city-name {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .digital-time {
            background: rgba(0, 0, 0, 0.3);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 36px;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        .time-details {
            color: #b0b0b0;
            font-size: 12px;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .add-timezone-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .add-timezone-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .add-timezone-btn:active {
            transform: scale(0.98);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .timezone-selector {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            background: white;
            color: #333;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
        }

        .btn-cancel {
            background: #eee;
            color: #333;
        }

        .btn-cancel:hover {
            background: #ddd;
        }

        .remove-btn {
            background: rgba(255, 100, 100, 0.3);
            color: #ff6464;
            border: 1px solid #ff6464;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(255, 100, 100, 0.5);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .digital-time {
                font-size: 28px;
                padding: 15px;
            }
        }

        .analog-clock {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            margin: 15px auto;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .clock-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
        }

        .hour-hand {
            width: 4px;
            height: 30px;
            margin-left: -2px;
        }

        .minute-hand {
            width: 3px;
            height: 38px;
            margin-left: -1.5px;
        }

        .second-hand {
            width: 2px;
            height: 40px;
            margin-left: -1px;
            background: #00ff88;
        }

        .center-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ Digital Clock</h1>
            <p>Current time in different time zones around the world</p>
        </div>

        <div class="controls">
            <button class="add-timezone-btn" onclick="openModal()">+ Add Time Zone</button>
            <button class="reset-btn" onclick="resetToDefault()">Reset to Default</button>
        </div>

        <div class="clocks-grid" id="clocksGrid"></div>

        <div class="footer">
            <p>⏱️ Updates every second | Click a clock card to remove it</p>
        </div>
    </div>

    <!-- Modal for adding timezone -->
    <div class="modal" id="timezoneModal">
        <div class="modal-content">
            <h2>Add Time Zone</h2>
            <select id="timezoneSelect">
                <option value="">Select a time zone...</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-add" onclick="addTimezone()">Add</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultTimezones = [
            { name: 'New York', timezone: 'America/New_York' },
            { name: 'London', timezone: 'Europe/London' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo' },
            { name: 'Sydney', timezone: 'Australia/Sydney' },
            { name: 'Dubai', timezone: 'Asia/Dubai' },
            { name: 'Singapore', timezone: 'Asia/Singapore' }
        ];

        const allTimezones = [
            // Americas
            { name: 'New York', timezone: 'America/New_York' },
            { name: 'Los Angeles', timezone: 'America/Los_Angeles' },
            { name: 'Chicago', timezone: 'America/Chicago' },
            { name: 'Denver', timezone: 'America/Denver' },
            { name: 'Toronto', timezone: 'America/Toronto' },
            { name: 'Mexico City', timezone: 'America/Mexico_City' },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo' },
            { name: 'Buenos Aires', timezone: 'America/Argentina/Buenos_Aires' },
            // Europe
            { name: 'London', timezone: 'Europe/London' },
            { name: 'Paris', timezone: 'Europe/Paris' },
            { name: 'Berlin', timezone: 'Europe/Berlin' },
            { name: 'Madrid', timezone: 'Europe/Madrid' },
            { name: 'Amsterdam', timezone: 'Europe/Amsterdam' },
            { name: 'Moscow', timezone: 'Europe/Moscow' },
            { name: 'Istanbul', timezone: 'Europe/Istanbul' },
            { name: 'Athens', timezone: 'Europe/Athens' },
            // Middle East & Africa
            { name: 'Dubai', timezone: 'Asia/Dubai' },
            { name: 'Cairo', timezone: 'Africa/Cairo' },
            { name: 'Johannesburg', timezone: 'Africa/Johannesburg' },
            { name: 'Lagos', timezone: 'Africa/Lagos' },
            // Asia
            { name: 'Bangkok', timezone: 'Asia/Bangkok' },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong' },
            { name: 'Shanghai', timezone: 'Asia/Shanghai' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo' },
            { name: 'Seoul', timezone: 'Asia/Seoul' },
            { name: 'Singapore', timezone: 'Asia/Singapore' },
            { name: 'Mumbai', timezone: 'Asia/Kolkata' },
            { name: 'Delhi', timezone: 'Asia/Kolkata' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok' },
            { name: 'Manila', timezone: 'Asia/Manila' },
            // Oceania
            { name: 'Sydney', timezone: 'Australia/Sydney' },
            { name: 'Melbourne', timezone: 'Australia/Melbourne' },
            { name: 'Auckland', timezone: 'Pacific/Auckland' },
            { name: 'Fiji', timezone: 'Pacific/Fiji' }
        ];

        let currentTimezones = JSON.parse(localStorage.getItem('selectedTimezones')) || defaultTimezones;

        function updateClocks() {
            const gridContainer = document.getElementById('clocksGrid');
            gridContainer.innerHTML = '';

            currentTimezones.forEach((tz, index) => {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });

                const formatterDate = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz.timezone,
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: '2-digit'
                });

                const timeString = formatter.format(now);
                const dateString = formatterDate.format(now);

                // Calculate time for analog clock
                const options = {
                    timeZone: tz.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                };
                const time = new Intl.DateTimeFormat('en-US', options).format(now);
                const [hours, minutes, seconds] = time.split(':').map(Number);

                const clockCard = document.createElement('div');
                clockCard.className = 'clock-card';
                clockCard.onclick = () => removeTimezone(index);
                clockCard.style.cursor = 'pointer';
                clockCard.title = 'Click to remove';

                clockCard.innerHTML = `
                    <div class="timezone-label">${tz.timezone}</div>
                    <div class="city-name">${tz.name}</div>
                    
                    <div class="analog-clock">
                        <div class="clock-face">
                            <div class="hand hour-hand" style="transform: rotate(${(hours % 12) * 30 + minutes * 0.5}deg)"></div>
                            <div class="hand minute-hand" style="transform: rotate(${minutes * 6 + seconds * 0.1}deg)"></div>
                            <div class="hand second-hand" style="transform: rotate(${seconds * 6}deg)"></div>
                            <div class="center-dot"></div>
                        </div>
                    </div>

                    <div class="digital-time">${timeString}</div>
                    <div class="time-details">${dateString}</div>
                `;

                gridContainer.appendChild(clockCard);
            });
        }

        function removeTimezone(index) {
            currentTimezones.splice(index, 1);
            localStorage.setItem('selectedTimezones', JSON.stringify(currentTimezones));
            updateClocks();
        }

        function resetToDefault() {
            currentTimezones = defaultTimezones;
            localStorage.setItem('selectedTimezones', JSON.stringify(currentTimezones));
            updateClocks();
        }

        function openModal() {
            const modal = document.getElementById('timezoneModal');
            const select = document.getElementById('timezoneSelect');
            select.innerHTML = '<option value="">Select a time zone...</option>';

            allTimezones.forEach(tz => {
                const isDuplicate = currentTimezones.some(ctz => ctz.timezone === tz.timezone);
                if (!isDuplicate) {
                    const option = document.createElement('option');
                    option.value = tz.timezone;
                    option.textContent = `${tz.name} (${tz.timezone})`;
                    select.appendChild(option);
                }
            });

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('timezoneModal').classList.remove('active');
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const selectedTimezone = select.value;

            if (!selectedTimezone) {
                alert('Please select a time zone');
                return;
            }

            const timezone = allTimezones.find(tz => tz.timezone === selectedTimezone);
            if (timezone && !currentTimezones.some(ctz => ctz.timezone === timezone.timezone)) {
                currentTimezones.push(timezone);
                localStorage.setItem('selectedTimezones', JSON.stringify(currentTimezones));
                updateClocks();
                closeModal();
            }
        }

        // Close modal when clicking outside
        document.getElementById('timezoneModal').onclick = function(event) {
            if (event.target === this) {
                closeModal();
            }
        }

        // Initial update and set interval
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
